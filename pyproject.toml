[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-cli"
version = "0.1.0"
description = "Advanced AI Coding Assistant CLI inspired by Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sayan Mahata", email = "sm6881164@gmail.com"}
]
keywords = ["ai", "cli", "coding-assistant", "llm", "claude-code", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
aether = "aether.cli:app"

[project.urls]
Homepage = "https://github.com/sayan9168/aether-cli"
Repository = "https://github.com/sayan9168/aether-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]
